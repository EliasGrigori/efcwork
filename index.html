<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EFCwork</title>
<meta name="description" content="EFCwork · Cwork Quality — controle de qualidade agrícola da família EFClaudian.">
<meta name="theme-color" content="#121524">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
/* ===== base.css ===== */
/* EFCwork · base.css — tokens, tipografia e componentes comuns.
   Temas: Claro (marfim + ouro, botões em degradê dourado) e Escuro (o Dourado original do EFClaudian).
   Fontes: Fraunces (títulos) e Source Sans 3 (texto) — aprovadas em 05/11/2026. */
:root{
  --f:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fh:'Fraunces',Georgia,'Times New Roman',serif;
  --bg0:#f7f5ef;--bg1:#fffefb;--bg2:#f2eee4;--bd:#e6dfcf;--bd2:#d8cdb2;
  --tx:#1e1b14;--tx2:#5b5443;--tx3:#8d846c;
  --a:#9a7128;--aS:rgba(154,113,40,.12);--aT:#1c1406;--aTx:#7d5a1c;
  --ok:#2f7d4f;--okS:rgba(47,125,79,.12);--wa:#9a6a0c;--waS:rgba(154,106,12,.13);--cr:#b33a32;--crS:rgba(179,58,50,.11);
  --sh:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.05);
  --sb:#fffdf8;--sbTx:#2a2519;--sbBd:#e6dfcf;
  --ouro:linear-gradient(135deg,#f7df9e 0%,#d9b46a 42%,#b4862f 100%);
  --r:10px;--rs:7px;--btn:36px;--row:40px;--onCr:#fff;--onOuro:#1c1406;
  color-scheme:light
}
:root[data-tema="escuro"]{
  --bg0:#0b0d16;--bg1:#121524;--bg2:#181c2e;--bd:#2a2b3b;--bd2:#3d3b4b;
  --tx:#f3eee3;--tx2:#bcb3a1;--tx3:#80796a;
  --a:#d9b46a;--aS:rgba(217,180,106,.15);--aT:#1c1406;--aTx:#f0d48f;
  --ok:#7fbf98;--okS:rgba(127,191,152,.14);--wa:#e2b55f;--waS:rgba(226,181,95,.14);--cr:#e38b7d;--crS:rgba(227,139,125,.14);
  --sh:0 16px 40px rgba(0,0,0,.45);
  --sb:rgba(14,17,32,.94);--sbTx:#efe9da;--sbBd:rgba(217,180,106,.14);
  color-scheme:dark
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
:root[data-tema="escuro"] body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(48% 38% at 92% -4%,rgba(232,196,119,.20),transparent 70%),radial-gradient(42% 36% at -6% 104%,rgba(120,96,200,.16),transparent 72%),repeating-linear-gradient(45deg,rgba(217,180,106,.028) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(217,180,106,.028) 0 1px,transparent 1px 22px)}
#app{position:relative;z-index:1;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--aTx)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.01em;margin:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}

/* botões: uma altura no PC (36 px), 44 px no toque */
.bt{height:var(--btn);padding:0 14px;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--bg1);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--tx);text-decoration:none}
.bt:hover{background:var(--bg2)}
.bt .ic{width:16px;height:16px}
.bt.pr{background:var(--ouro);border-color:#c99d48;color:#1c1406;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(217,180,106,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.bt.pr::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.bt.pr::after{animation:ouroBrilho 6s ease-in-out infinite}}
@keyframes ouroBrilho{0%,70%{left:-60%}100%{left:130%}}
.bt.pr:hover{filter:brightness(1.04)}
.bt.ic-so{width:var(--btn);padding:0;color:var(--tx2)}
.bt.lk{border-color:transparent;background:transparent;color:var(--aTx);padding:0 6px}
.bt[disabled]{opacity:.55;cursor:not-allowed}
@media (pointer:coarse){:root{--btn:44px}}

/* campos */
.cp{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--tx2)}
.cp input,.cp select,.cp textarea{height:42px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg0);padding:0 12px;font-weight:500;color:var(--tx);font-size:15px;width:100%}
.cp textarea{height:auto;min-height:80px;padding:10px 12px}
.cp small{font-weight:400;color:var(--tx3)}
.cp input:focus,.cp select:focus,.cp textarea:focus{outline:2px solid var(--aS);border-color:var(--a)}

/* pílulas de situação */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:1px 8px;border-radius:5px;white-space:nowrap;background:var(--bg2);color:var(--tx2)}
.pill.ok{background:var(--okS);color:var(--ok)}.pill.wa{background:var(--waS);color:var(--wa)}.pill.cr{background:var(--crS);color:var(--cr)}

/* cartão de número (um só estilo no app inteiro) */
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kp{background:var(--bg1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:var(--sh);text-decoration:none;color:inherit}
.kp b{font-family:var(--fh);font-size:28px;font-weight:600;line-height:1.1}
.kp span{font-size:13px;color:var(--tx2)}
.kp.cr b{color:var(--cr)}.kp.wa b{color:var(--wa)}

/* painel */
.pn{background:var(--bg1);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0}
:root[data-tema="escuro"] .pn,:root[data-tema="escuro"] .kp{border-color:rgba(217,180,106,.16);box-shadow:inset 0 1px 0 rgba(217,180,106,.10)}
.pn .hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.pn .hd h3{font-size:16px}
.pn .hd em{font-style:normal;font-size:12px;padding:0 7px;border-radius:5px;background:var(--bg2);color:var(--tx2)}
.pn .hd .sp{flex:1}
.pn .li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);min-width:0}
.pn .li:last-child{border-bottom:0}
.pn .li .tx{min-width:0;flex:1}
.pn .li .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .li .tx small{color:var(--tx3);font-size:13px}
.pn .cpo{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ico{width:32px;height:32px;border-radius:var(--rs);display:grid;place-items:center;background:var(--bg2);color:var(--tx2);flex:none}
.vazio{padding:22px 16px;text-align:center;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:8px}
.vazio b{color:var(--tx);font-weight:600}

/* avisos */
.av-pilha{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.av{pointer-events:auto;background:var(--tx);color:var(--bg1);padding:10px 14px;border-radius:8px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .3s}
.av.erro{background:var(--cr);color:#fff}
.av.sai{opacity:0}
.av-df{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

/* ===== casca.css ===== */
/* EFCwork · casca.css — menu lateral, barra de cima, cabeçalho de página, abas, barra de baixo do celular. Prefixo: cs- */
.cs-carregando{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx2)}
.cs-carregando .ic{width:34px;height:34px;color:var(--a)}
.cs-app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.cs-lado{position:sticky;top:0;height:100vh;background:var(--sb);color:var(--sbTx);border-right:1px solid var(--sbBd);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;z-index:20}
.cs-marca{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.cs-logo{width:34px;height:34px;border-radius:9px;background:var(--ouro);color:#1c1406;display:grid;place-items:center;flex:none;overflow:hidden}
.cs-logo .ic{width:20px;height:20px;stroke-width:1.9}
.cs-logo img{width:100%;height:100%;object-fit:cover}
.cs-nm b{display:block;font-family:var(--fh);font-size:18px;font-weight:600;line-height:1.1}
.cs-nm span{font-size:12px;opacity:.7}
.cs-emp{margin:0 4px 10px;padding:8px 10px;border:1px solid var(--sbBd);border-radius:var(--rs);background:transparent;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;cursor:pointer;color:inherit}
.cs-emp b{font-weight:600;font-size:14px;display:block}.cs-emp small{display:block;font-size:12px;opacity:.7}
.cs-gh{font-size:12px;font-weight:600;opacity:.6;padding:12px 10px 4px}
.cs-nav{display:flex;flex-direction:column;gap:2px}
.cs-it{display:flex;align-items:center;gap:10px;padding:0 10px;height:38px;border-radius:var(--rs);color:inherit;opacity:.88;font-weight:500;text-decoration:none;position:relative}
.cs-it:hover{background:var(--bg2);opacity:1}
.cs-it.on{opacity:1;background:var(--aS);color:var(--aTx);font-weight:600}
.cs-it.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--a)}
:root[data-tema="escuro"] .cs-it.on{background:linear-gradient(90deg,rgba(217,180,106,.18),rgba(217,180,106,.04));color:#f0d48f}
:root[data-tema="escuro"] .cs-it.on::before{background:linear-gradient(180deg,#f7df9e,#b4862f)}
:root[data-tema="escuro"] .cs-it:hover{background:rgba(255,255,255,.05)}
.cs-pe{margin-top:auto;border-top:1px solid var(--sbBd);padding:10px 0 0;display:flex;flex-direction:column;gap:8px}
.cs-us{display:flex;gap:8px;align-items:center;padding:0 4px}
.cs-av{width:32px;height:32px;border-radius:50%;background:var(--aS);color:var(--aTx);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.cs-ust{min-width:0;flex:1}.cs-ust b{font-size:14px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cs-ust small{font-size:12px;opacity:.7}
.cs-cw{font-size:12px;opacity:.6;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 6px}
.cs-main{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.cs-topo{position:sticky;top:0;z-index:15;height:56px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg0) 88%,transparent);backdrop-filter:saturate(1.2) blur(6px)}
:root[data-tema="escuro"] .cs-topo{background:rgba(11,13,22,.72)}
.cs-busca{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--bd);border-radius:var(--rs);padding:0 10px;color:var(--tx3);width:min(380px,100%);background:var(--bg1);cursor:pointer;text-align:left}
.cs-busca span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-busca kbd{font-family:var(--f);font-size:12px;border:1px solid var(--bd2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--tx2)}
.cs-sp{flex:1}
.cs-sync{font-size:13px;color:var(--ok);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cs-sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.cs-sync.off{color:var(--wa)}.cs-sync.off i{background:var(--wa)}
.cs-ct{flex:1;padding:20px 20px 28px;display:flex;flex-direction:column;gap:16px;width:100%}
.cs-rod{padding:14px 20px 90px;font-size:12px;color:var(--tx3)}
@media(min-width:900px){.cs-rod{padding-bottom:18px}}
/* cabeçalho de página */
.cs-ph{display:flex;flex-direction:column;gap:6px}
.cs-bc{font-size:13px;color:var(--tx3)}
.cs-bc b{color:var(--tx2);font-weight:500}
.cs-phr{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cs-pht{min-width:0}
.cs-ph h1{font-size:30px;line-height:1.15;position:relative;padding-bottom:8px;text-wrap:balance}
.cs-ph h1::after{content:"";position:absolute;left:0;bottom:0;width:40px;height:2px;border-radius:2px;background:var(--a)}
:root[data-tema="escuro"] .cs-ph h1{background:linear-gradient(90deg,#f7e2a8,#d9b46a 60%,#c29640);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-tema="escuro"] .cs-ph h1::after{background:linear-gradient(90deg,#f7df9e,#b4862f)}
.cs-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--tx2);font-size:14px;margin-top:6px}
.cs-pl{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:5px;background:var(--bg2);border:1px solid var(--bd);font-size:13px}
.cs-pl .ic{width:14px;height:14px}
.cs-pl.cr{color:var(--cr)}.cs-pl.wa{color:var(--wa)}.cs-pl.ok{color:var(--ok)}
.cs-acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cs-abas{display:flex;gap:2px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.cs-abas::-webkit-scrollbar{display:none}
.cs-abas a{padding:9px 12px;font-weight:500;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap}
.cs-abas a:hover{color:var(--tx)}
.cs-abas a.on{color:var(--aTx);border-bottom-color:var(--a);font-weight:600}
:root[data-tema="escuro"] .cs-abas a.on{border-image:linear-gradient(90deg,#f7df9e,#b4862f) 1}
/* celular */
.cs-so-cel{display:none}
.cs-baixo{display:none}
.cs-fundo{display:none}
@media(max-width:899px){
  .cs-app{grid-template-columns:1fr}
  .cs-lado{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);transform:translateX(-102%);transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.25);padding-top:max(14px,env(safe-area-inset-top,0px))}
  .menu-aberto .cs-lado{transform:none}
  .menu-aberto .cs-fundo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
  .cs-so-cel{display:inline-flex}
  .cs-topo{padding:0 12px;gap:8px}
  .cs-busca{width:auto;flex:1;min-width:0}
  .cs-busca kbd,.cs-sync{display:none}
  .cs-sp{display:none}
  .cs-ct{padding:16px 16px 20px}
  .cs-ph h1{font-size:25px}
  .cs-baixo{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:18;background:var(--bg1);border-top:1px solid var(--bd);padding:6px 4px max(8px,env(safe-area-inset-bottom,0px))}
  .cs-baixo a,.cs-baixo button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--tx3);padding:4px 0;text-decoration:none;background:none;border:0;min-height:44px;cursor:pointer}
  .cs-baixo .ic{width:22px;height:22px}
  .cs-baixo .on{color:var(--aTx);font-weight:600}
}
@media(prefers-reduced-motion:reduce){.cs-lado{transition:none}}
/* aviso antes de descartar (camadas) */
.cf-fundo{position:fixed;inset:0;z-index:90;background:rgba(10,10,20,.42);display:grid;place-items:center;padding:16px}
.cf-caixa{width:min(400px,100%);background:var(--bg1);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);padding:20px;display:flex;flex-direction:column;gap:8px}
.cf-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--waS);color:var(--wa)}
.cf-caixa h2{font-size:20px}
.cf-caixa p{margin:0;color:var(--tx2)}
.cf-bts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}

/* ===== tabela.css ===== */
/* EFCwork · tabela.css — tabela padrão, janela retrátil, gaveta e impressão. Prefixos: tb-, dd-, gv- */
.tb{display:flex;flex-direction:column;gap:10px;min-width:0}
.tb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-busca{display:flex;align-items:center;gap:8px;height:var(--btn);border:1px solid var(--bd2);border-radius:var(--rs);padding:0 10px;color:var(--tx3);width:min(280px,100%);background:var(--bg1)}
.tb-busca input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;color:var(--tx);font-size:14px}
.tb-flt{display:inline-flex;align-items:center;gap:7px;height:var(--btn);padding:0 12px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg1);font-size:14px;color:var(--tx2);cursor:pointer;max-width:100%}
.tb-flt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-flt b{color:var(--tx);font-weight:600}
.tb-flt em{font-style:normal;font-size:12px;font-weight:700;background:var(--a);color:var(--aT);border-radius:5px;padding:0 6px}
.tb-flt.on{border-color:var(--a)}
.tb-flt .ic{width:16px;height:16px}
.tb-cont{font-size:14px;color:var(--tx3);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.tb-sp{flex:1}
.tb-painel{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg1)}
.tb-pf{display:flex;flex-direction:column;gap:4px;min-width:200px}
.tb-pf>span,.tb-pt{font-size:13px;font-weight:600;color:var(--tx3);width:100%}
.tb-ck{display:inline-flex;gap:7px;align-items:center;font-size:14px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;cursor:pointer;background:var(--bg0)}
.tb-ck input{accent-color:var(--a)}
.tb-w{background:var(--bg1);border:1px solid var(--bd);border-radius:var(--r);overflow:auto;box-shadow:var(--sh);max-width:100%}
:root[data-tema="escuro"] .tb-w{border-color:rgba(217,180,106,.16);box-shadow:inset 0 1px 0 rgba(217,180,106,.10)}
.tb-t{width:100%;border-collapse:collapse;font-size:14px}
.tb-t th{position:sticky;top:0;z-index:1;height:var(--row);text-align:left;font-weight:600;font-size:13px;color:var(--tx2);background:var(--bg2);padding:0;border-bottom:1px solid var(--bd);white-space:nowrap}
.tb-t th button{all:unset;box-sizing:border-box;display:flex;gap:5px;align-items:center;width:100%;height:var(--row);padding:0 12px;cursor:pointer}
.tb-t th.n button{justify-content:flex-end}
.tb-t th button:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.tb-seta{color:var(--aTx);font-size:10px}
.tb-t td{height:var(--row);padding:4px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tb-t td.n,.tb-t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tb-t tbody tr[data-act]{cursor:pointer}
.tb-t tbody tr[data-act]:hover td{background:var(--bg2)}

.tb-med i{position:absolute;inset:0 auto 0 0;border-radius:3px}
/* janela retrátil */
.dd{position:relative;min-width:180px}
.dd-b{width:100%;height:var(--btn);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg0);cursor:pointer;font-weight:600;font-size:14px}

.dd-l{position:absolute;left:0;min-width:100%;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--bg1);border:1px solid var(--bd2);border-radius:var(--rs);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40;max-height:300px;overflow:auto}

.dd-l li .ic{width:15px;height:15px}
.dd-l li[data-rm]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.dd-l li.dd-dica{cursor:default;min-height:0;padding:6px 10px 4px;font-size:12px;color:var(--tx3);white-space:normal;border-top:1px solid var(--bd);margin-top:4px}

/* gaveta */
.gv{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg1);border-left:1px solid var(--bd);box-shadow:-14px 0 34px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top,0px)}

.gv-cab{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--bd)}
.gv-tx{flex:1;min-width:0}

.gv-tx h2{font-size:21px;line-height:1.2;margin:2px 0 6px;overflow-wrap:anywhere}

.gv-pe{padding:12px 18px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
.gv-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gv-kv div{background:var(--bg0);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 6px;text-align:center}
.gv-kv b{display:block;font-family:var(--fh);font-size:19px;font-weight:600}

.gv-fl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.gv-fl dt{color:var(--tx3)}.gv-fl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.gv-h{margin:0;font-size:13px;font-weight:600;color:var(--tx2)}
.gv-tl{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--bd)}
.gv-tl li{position:relative;padding:0 0 10px 14px;font-size:14px}
.gv-tl li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg1);border:2px solid var(--a)}

.gv-lotes{display:flex;flex-direction:column;gap:6px}
.gv-lote{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--rs);font-size:14px;background:var(--bg0)}

/* ---------- pessoas ---------- */
const isSup = u => !!u && (isPrincipal(u) || (u.perfil === 'secundario' && u.estrela === true));

  const m = {}; Object.keys(S._notifPartes || {}).forEach(k => (S._notifPartes[k] || []).forEach(n => { m[n.id] = n; }));

}

function notifLigar() {
  if (!S.user) return;
  const ch = notifChaves(S.user), chave = S._notifModo === 'antigo' ? 'antigo' : ch.join('|');

  notifDesligar(); S._notifChaves = chave; S._notifPartes = {};
  const antigo = () => { /* sem o índice no Firebase: escuta as últimas 300 e filtra aqui */

}

    }

    return id;
  },
  podeDecidir(a) { const u = S.user; return !!u && a.status === 'pendente' && ((isSup(u) && (a.paraIds || []).indexOf(u.id) >= 0) || isPrincipal(u)); },
  pendentesParaMim() {

  },

    if (!ok && !motivo) { aviso('Escreva o motivo da reprovação.', 'erro'); return false; }

  }

function lcEntradaOk() {

    const i = alItem(l.itemId); if (!i) return lcErro('Um dos materiais não existe mais.');

};
async function lcCorrOk() {
  const f = S.fm, m = S.almMov.find(x => x.id === f.movId); if (!m || !alPodeCorrigir(m)) return;
  const q = alR(alNum(f.qtd)); if (!(q > 0)) return lcErro('Quantidade inválida. Para desfazer tudo, use Anular.');
  const novo = { qtd: q };
  if (m.tipo === 'saida') {
    novo.motivo = String(f.motivo || '').trim(); if (!novo.motivo) return lcErro('Informe o motivo da saída.');
    const l = alIdx().lots[m.lotRef], cabe = alR((l ? l.saldo : 0) + (Number(m.qtd) || 0));
    if (q > cabe + 1e-9) return lcErro('No lote ' + (m.lote || 'sem lote') + ' só cabe até ' + alQ(cabe) + '. O saldo não pode ficar negativo.');
  } else {
    novo.lote = String(f.lote || '').trim(); novo.validade = f.validade || ''; novo.doc = String(f.doc || '').trim();
    const pr = String(f.preco || '').trim(); novo.preco = pr ? alNum(pr) : 0; if (isNaN(novo.preco) || novo.preco < 0) return lcErro('Valor inválido.');
    const cons = alConsumido(m); if (q < cons - 1e-9) return lcErro('Deste lote já saíram ' + alQ(cons) + '. A quantidade não pode ser menor que isso.');
    const i = alItem(m.itemId); if (i && i.controlaVal && (!novo.lote || !novo.validade)) return lcErro('Este item controla validade: informe lote e validade.');
  }
  const antes = {}, depois = {};
  Object.keys(novo).forEach(k => { if (String(m[k] == null ? '' : m[k]) !== String(novo[k])) { antes[k] = m[k] == null ? '' : m[k]; depois[k] = novo[k]; } });
  if (!Object.keys(depois).length) return lcErro('Nada foi mudado.');
  const mot = String(f.motivoG || '').trim(); if (mot.length < 3) return lcErro('Escreva por que está corrigindo.');
  if (!lcTravar()) return;
  if (!alCorrigeDireto(m)) { lcFim(); await lcPedirOuFazer('corrigir_mov', m.id, { antes: antes, depois: depois, motivo: mot }, 'Corrigir ' + (AL_TIPO[m.tipo] || '').toLowerCase() + ' de ' + m.itemNome, Object.keys(depois).map(k => k + ': ' + antes[k] + ' → ' + depois[k]).join(' · ') + ' — ' + mot, ''); return; }
  const h = (m.historico || []).concat([{ ts: nowISO(), por: S.user.nome, porId: S.user.id, motivo: mot, antes: antes, depois: depois }]);
  const ps = [Data.col('sv2_alm_mov').update(m.id, Object.assign({}, depois, { historico: h }))];
  /* a saída guarda uma cópia do lote e da validade: acompanha a correção da entrada */
  if (m.tipo !== 'saida' && ('lote' in depois || 'validade' in depois || 'preco' in depois)) S.almMov.filter(x => x.lotRef === m.id && !x.anulada).forEach(x => { const p = {}; ['lote', 'validade', 'preco'].forEach(k => { if (k in depois) p[k] = depois[k]; }); ps.push(Data.col('sv2_alm_mov').update(x.id, p)); });
  Audit.log({ acao: 'corrigir_mov_almox', entidade: 'almox_item', entidadeId: m.itemId, resumo: 'Corrigiu ' + AL_TIPO[m.tipo].toLowerCase() + ' de ' + m.itemNome + ' (' + fmtD(m.data) + '): ' + Object.keys(depois).map(k => k + ' ' + antes[k] + ' → ' + depois[k]).join(', ') + ' — motivo: ' + mot, antes: antes, depois: depois });
  lcGrava(ps, 'Corrigido. O valor antigo ficou no histórico.');
}

  const f = S.fm, m = S.almMov.find(x => x.id === f.movId); if (!m || !alPodeCorrigir(m)) return;

LC_FORM.naoconf = f => {

  return { ico: 'alerta', icoCls: 'ini-cr', sub: 'Saída não confere · ' + alQ(m.qtd) + ' · ' + fmtD(m.data) + ' · ' + (m.porNome || ''), titulo: m.itemNome, corpo: lcMsg() + lcAv('A saída continua registrada; quem lançou é avisado. Para acertar, use Corrigir ou Anular na saída.') + lcBl('O que não confere?', lcTx('motivoG', f.motivoG, 'Ex.: a quantidade usada foi outra, o frasco não saiu')), rodape: lcPe('lc-crit-nao-ok', 'Marcar que não confere') };
};
function lcCritDecidir(id, ok, motivo) {
  const m = S.almMov.find(x => x.id === id);
  if (!m || !alCritPendMov(m)) { aviso('Esta saída já foi decidida.', 'erro'); return false; }
  if (!alCtrl(S.user)) { aviso('Só o Líder, o Administrador ou quem tem Controle do almoxarifado confirma.', 'erro'); return false; }
  const mot = ok ? '' : String(motivo || '').trim(); if (!ok && mot.length < 3) return lcErro('Escreva o que não confere.');
  const alvo = S.almMov.filter(x => alCritPendMov(x) && x.itemId === m.itemId && (x.id === m.id || (m.grupo && x.grupo === m.grupo)));
  const c = { st: ok ? 'confirmada' : 'nao_confere', porId: S.user.id, porNome: S.user.nome, ts: nowISO(), proprio: m.por === S.user.id }; if (!ok) c.motivo = mot;
  const qt = alR(alvo.reduce((s, x) => s + (Number(x.qtd) || 0), 0));
  const ps = alvo.map(x => Data.col('sv2_alm_mov').update(x.id, { critico: Object.assign({}, x.critico, c) }));
  Audit.log({ acao: ok ? 'critico_confirmar' : 'critico_nao_confere', entidade: 'almox_item', entidadeId: m.itemId, resumo: (ok ? 'Confirmou' : 'Não confere:') + ' saída de produto crítico ' + alQ(qt) + ' ' + m.itemNome + ' (' + fmtD(m.data) + ', lançada por ' + (m.porNome || '') + ')' + (c.proprio ? ' — confirmada por quem lançou' : '') + (mot ? ' — ' + mot : ''), antes: { critico: 'pendente' }, depois: { critico: c.st } });
  if (m.por && m.por !== S.user.id) Notif.send({ nivel: ok ? 'info' : 'aviso', titulo: ok ? 'Saída confirmada: ' + m.itemNome : 'Saída NÃO confere: ' + m.itemNome, texto: S.user.nome + (ok ? ' confirmou' : ' marcou que não confere') + ' a saída de ' + alQ(qt) + ' ' + m.itemNome + ' de ' + fmtD(m.data) + (mot ? ': ' + mot : '') + '.', para: [m.por], refTipo: 'alm_mov', refId: m.id }).catch(() => {});
  if (S.fm) lcGrava(ps, ok ? 'Saída confirmada.' : 'Marcada como não confere. Quem lançou foi avisado.');
  else { aviso(ok ? 'Saída confirmada.' : 'Marcada como não confere.'); Promise.all(ps).catch(e => aviso(svErro(e), 'erro')); }
  return true;
}

/* ===== contagem.js ===== */
/* EFCwork · contagem.js — CONTAGEM ÀS CEGAS do Almoxarifado (v0.3.2, pedido do Elias de 05/11 e Nº 51).
   Fluxo: o Líder/Administrador abre e escolhe quem conta (só aparece quem tem o Almoxarifado) → quem conta vê os materiais na ordem do
   lugar (portas em sequência, depois gavetas, depois o resto), lote a lote, SEM o saldo do sistema → na conferência aparecem os que não
   bateram e o app sugere recontar → depois da recontagem, cada diferença recebe o que aconteceu: saída esquecida (lançada com a data certa
   e marcada como ERRO DE LANÇAMENTO, com quem esqueceu e a reclamação), perda, quebra, achado… → concluir aplica tudo.
   Formato compatível com o EFClaudian (sv2_alm_inv: numero CNT-AAAA-NN, tipo 'contagem', partes.mat, contagens.m_<id> {cont, lotes, esp, …}).
   Campos novos (o EFClaudian ignora): contadorId/contadorNome, recontar{}, resolucoes{}. Prefixo: cg. */
Object.assign(S, { almInv: [], cgRasc: {}, cgVista: '' });
const CG_RES_EQ = { falta: [['nao_achado', 'Não encontrado (marcar no equipamento)'], ['Em outro lugar', 'Está em outro lugar'], ['Outro', 'Outro']], sobra: [['Outro', 'Outro']] };
const CG_RES_VID = { falta: [['Quebra', 'Quebra'], ['Perda', 'Perda'], ['Erro de lançamento', 'Erro de lançamento'], ['Outro', 'Outro']], sobra: [['Achado', 'Achado'], ['Entrada não lançada', 'Entrada não lançada'], ['Erro de lançamento', 'Erro de lançamento'], ['Outro', 'Outro']] };
const CG_RES = {
  falta: [['saida_retro', 'Saída esquecida (lançar com a data certa)'], ['Perda', 'Perda'], ['Quebra', 'Quebra'], ['Erro de lançamento', 'Erro de lançamento (sem saída)'], ['Outro', 'Outro']],
  sobra: [['Entrada não lançada', 'Entrada não lançada'], ['Achado', 'Achado'], ['Erro de lançamento', 'Erro de lançamento'], ['Outro', 'Outro']]
};
CS_CARGAS.push(() => { if (!alVe()) return; csOuve('sv2_alm_inv', l => { S.almInv = l; if (S.rota.area === 'almox' || S.rota.area === 'inicio') render(); }); });

/* ---------- dados ---------- */
const cgAberta = () => S.almInv.find(x => x.situacao === 'aberto') || null;
const cgDe = id => S.almInv.find(x => x.id === id) || null;
const cgChave = k => k.replace(':', '_');
function cgContagens(inv) { const o = {}, c = (inv && inv.contagens) || {}; Object.keys(c).forEach(k => { o[k.replace('_', ':')] = c[k]; }); return o; }
/* recontagem e decisão SEM depender de quem conta apagar marcas (v0.3.6: a regra do Firestore só deixa quem conta gravar `contagens`).
   recontar[k] = nº de contagens anteriores + 1 na hora do pedido → continua pedida enquanto o item não for contado de novo;
   resolucoes[k].nCont = nº de contagens anteriores na hora da decisão → a decisão perde a validade se o item for contado de novo.
   (true = formato antigo: recontagem pedida.) */
const cgNAnt = c => ((c && c.ant) || []).length;
function cgRc(inv, k) { const v = (inv.recontar || {})[cgChave(k)]; if (!v) return false; if (v === true) return true; return cgNAnt(cgContagens(inv)[k]) < Number(v); }
function cgRs(inv, k) { const r = (inv.resolucoes || {})[cgChave(k)]; if (!r) return null; if (r.nCont == null) return r; return cgNAnt(cgContagens(inv)[k]) === r.nCont ? r : null; }
const cgDif = c => c ? alR((Number(c.cont) || 0) - (Number((c.esp || {}).total) || 0)) : 0;
/* ordem do lugar: portas em sequência, depois gavetas, depois o resto (pedido do Elias) */
function cgOrdemLocal(loc) {
  const s = String(loc || '').trim(), p = s.match(/porta\s*(\d+)/i), g = s.match(/gaveta\s*(\d+)/i);

/* EFCwork · calibracao.js — CALIBRAÇÃO COM HISTÓRICO (v0.3.3, pedido do Elias de 05/11).
   Ciclo da solicitação, em etapas: Solicitada (data + número CAL-AAAA-NN) → Cotação recebida (data, valor de cada equipamento)
   → Agendada (data marcada) → Calibrada (data, QUEM CALIBROU, código do certificado/registro, validade, resultado) → Compra (Nº da
   solicitação de compras, data de hoje, NF) = Encerrada. No detalhe do equipamento: o histórico só dele, com validade e código.
   Formato do EFClaudian (sv2_alm_cal: numero, prestador, itens[{equipId, valor, data, certificado, resultado, aplicado, compra}],
   cotacaoEm, situacao) + campos novos que o EFClaudian ignora: agenda{data, obs, porNome, ts}, cotacaoRef, itens[].tecnico,
   itens[].validade; no equipamento cal.validade e cal.tecnico. Ações só do Líder/Administrador. Prefixo: cb. */
Object.assign(S, { almCal: [] });
CS_CARGAS.push(() => { if (!alVe()) return; csOuve('sv2_alm_cal', l => { S.almCal = l; if (S.rota.area === 'almox') render(); }); });

const cbEnc = it => !!(it.aplicado && it.data && it.certificado && it.compra && it.compra.numero);
function cbSit(c) {
  if (c.situacao === 'cancelada') return 'cancelada';
  const it = c.itens || [];
  if (it.length && it.every(cbEnc)) return 'encerrada';
  if (it.length && it.every(i => i.aplicado)) return 'realizada';
  if (it.some(i => i.aplicado)) return 'parcial';
  if (c.agenda && c.agenda.data) return 'agendada';
  if (it.length && it.every(i => Number(i.valor) > 0)) return 'cotada';
  return 'aberta';
}
const CB_SIT = { aberta: ['Aguardando cotação', 'wa'], cotada: ['Cotada · falta agendar', 'wa'], agendada: ['Agendada', ''], parcial: ['Calibração em andamento', 'wa'], realizada: ['Calibrada · falta a compra', 'wa'], encerrada: ['Encerrada', 'ok'], cancelada: ['Cancelada', ''] };
const cbSitTxt = c => { const s = cbSit(c); return s === 'agendada' ? 'Agendada para ' + fmtD(c.agenda.data) : CB_SIT[s][0]; };
const cbPill = c => alPill(cbSitTxt(c), CB_SIT[cbSit(c)][1]);

    { id: 'cal', nome: 'Calibrada', feito: it.length > 0 && apl.length === it.length, parcial: apl.length > 0 && apl.length < it.length, data: datas[datas.length - 1] || '', txt: apl.length ? apl.length + ' de ' + it.length + (tec.length ? ' · por ' + tec.join(', ') : '') : '' },

/* ---------- fluido da linha do tempo (pedido de 06/11) ----------
   Cada pessoa tem guardado até onde já VIU cada solicitação (cw-cbvisto-<pessoa>-<id>). Ao abrir a gaveta, o fluido sobe da última
   etapa vista até a atual; com 2 ou mais etapas novas, sobe uma, espera 0,4 s, sobe a próxima. Com a gaveta aberta, uma mudança sobe na hora.
   "Reduzir movimento" no aparelho: aparece pronto, sem animação. */
const CB_SOBE = 600, CB_PAUSA = 400, CB_GOTA = 300, CB_GOTA_PARA = 16; /* opção 3 · Gota, escolhida pelo Elias em 06/11 09:07 */

  if (S._cbNivel[id] != null) return Math.min(S._cbNivel[id], feitas);
  if (!csMovimento()) return feitas;
  const v = Number(Store.get(cbChaveVisto(id)) || 0); return Math.max(1, Math.min(v || 1, feitas));

function cbFluir(g, abriuAgora) {
  const ol = g.querySelector('[data-cbtl]'); if (!ol) return;
  const id = ol.getAttribute('data-cbtl'), feitas = Number(ol.getAttribute('data-feitas')) || 0, lis = Array.from(ol.querySelectorAll('.cb-tl > li'));
  const tubo = ol.querySelector('.cb-tubo'), fl = ol.querySelector('.cb-fluido'); if (!lis.length || !tubo) return;
  const centro = n => lis[n].offsetTop + 14, topo = centro(0);
  tubo.style.top = topo + 'px'; tubo.style.height = (centro(lis.length - 1) - topo) + 'px';
  const alto = n => n <= 1 ? 0 : Math.max(0, centro(n - 1) - topo - CB_GOTA_PARA); /* n = quantas etapas acesas; o fluido para na borda da bolinha (opção 3 · Gota) */

  const grava = n => { S._cbNivel[id] = n; Store.set(cbChaveVisto(id), n); };
  if (nivel >= feitas) { grava(feitas); return; }
  ol.classList.add('cb-correndo');
  const passo = () => {
    if (S._cbTok[id] !== tok || !ol.isConnected) return;
    nivel++; fl.style.transition = 'height ' + CB_SOBE + 'ms cubic-bezier(.45,.05,.3,1)'; fl.style.height = alto(nivel) + 'px';
    setTimeout(() => {
      if (S._cbTok[id] !== tok || !ol.isConnected) return;

/* reduz a foto para caber no limite da regra (sv2_fotos: até 400 mil caracteres) */
function coFotoReduz(arq) {
  return new Promise((ok, erro) => {
    const r = new FileReader(); r.onerror = () => erro(new Error('Não deu para ler a foto.'));
    r.onload = () => { const im = new Image(); im.onerror = () => erro(new Error('Arquivo não é uma imagem.')); im.onload = () => {
      let q = .72, lado = 1400, url = '';
      for (let n = 0; n < 6; n++) { const k = Math.min(1, lado / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); url = cv.toDataURL('image/jpeg', q); if (url.length < 380000) break; lado *= .8; q -= .06; }
      url.length < 400000 ? ok(url) : erro(new Error('A foto ficou grande demais.')); }; im.src = r.result; };
    r.readAsDataURL(arq);
  });
}

    acoes: '<a class="bt" href="' + EFCLAUDIAN_URL + '" target="_blank" rel="noopener">' + ic('externo') + 'Abrir o EFClaudian</a>' });
  /* tarefas */
  const lis = l.slice(0, 8).map(t => '<div class="li"><span class="ico' + (t._v ? ' ini-cr' : t._h ? ' ini-wa' : '') + '">' + ic(t._v ? 'alerta' : 'relogio') + '</span><span class="tx"><b>' + esc(t.titulo || '(sem título)') + '</b><small>' + (t.prazo ? 'prazo ' + fmtD(t.prazo) + (t.hora ? ' às ' + esc(t.hora) : '') : 'sem prazo') + '</small></span>' +
    '<span class="pill ' + (t._v ? 'cr' : t._h ? 'wa' : 'ok') + '">' + (t._v ? 'vencida' : t._h ? 'hoje' : 'no prazo') + '</span></div>').join('');
  const tarefas = '<section class="pn"><div class="hd"><h3>Minhas tarefas</h3><em>' + l.length + '</em><span class="sp"></span></div>' +
    (l.length ? lis + (l.length > 8 ? '<div class="li"><span class="tx"><small>+ ' + (l.length - 8) + ' tarefas. A lista completa chega na v0.2; até lá, veja no EFClaudian.</small></span></div>' : '') :
      '<div class="vazio">' + ic('ok') + '<b>Nada pendente com o seu nome.</b><span>As tarefas que o EFClaudian atribuir a você aparecem aqui.</span></div>') + '</section>';
  /* voltar para / mais usadas */
  const o = csUsoLer(), atual = S.rota.area + (S.rota.aba ? '/' + S.rota.aba : '');
  const rec = o.r.filter(k => k !== atual && k !== 'inicio').slice(0, 4), top = Object.keys(o.n).filter(k => o.n[k] >= 2 && k !== 'inicio').sort((a, b) => o.n[b] - o.n[a]).slice(0, 5);
  const lk = (k, n) => '<a class="ini-at" href="#/' + k + '">' + ic(csArea(k.split('/')[0]).ic) + esc(csNomeRota(k)) + (n ? '<em>' + n + '×</em>' : '') + '</a>';
  const atalhos = '<section class="pn"><div class="hd"><h3>Atalhos</h3></div><div class="cpo">' +
    (rec.length ? '<div><p class="ini-sub">Voltar para</p><div class="ini-ats">' + rec.map(k => lk(k)).join('') + '</div></div>' : '') +
    (top.length ? '<div><p class="ini-sub">Mais usadas</p><div class="ini-ats">' + top.map(k => lk(k, o.n[k])).join('') + '</div></div>' : '') +
    (!rec.length && !top.length ? '<p class="ini-vz">As telas que você abrir aparecem aqui para voltar com um toque.</p>' : '') + '</div></section>';
  /* plano das áreas */
  const plano = '<section class="pn"><div class="hd"><h3>Áreas do ' + APP_NOME + '</h3><span class="sp"></span><span class="pill">em construção</span></div>' +
    AREAS.filter(a => a.versao).sort((a, b) => a.versao.localeCompare(b.versao)).map(a => '<a class="li ini-li" href="#/' + a.id + '"><span class="ico">' + ic(a.ic) + '</span><span class="tx"><b>' + esc(a.nome) + '</b><small>' + (a.parcial ? esc(a.parcial) : 'chega na ' + a.versao + '; até lá, continua no EFClaudian') + '</small></span>' + ic('seta') + '</a>').join('') + '</section>';
  let nums = '';
  if (typeof alVe === 'function' && alVe() && (S.almCarregado || DEMO)) {
    const r = alResumo();
    nums = '<div class="kps"><a class="kp' + (r.aten.length ? ' wa' : '') + '" href="#/almox/materiais" data-act="al-ir" data-f="atencao"><b class="num">' + r.aten.length + '</b><span>Materiais que pedem atenção</span></a>' +
      '<a class="kp' + (r.calV ? ' cr' : r.calA ? ' wa' : '') + '" href="#/almox/equipamentos"><b class="num">' + (r.calV + r.calA) + '</b><span>Calibrações vencidas ou a vencer</span></a>' +
      '<a class="kp' + (r.solP ? ' wa' : '') + '" href="#/almox/solicitacoes"><b class="num">' + r.solP + '</b><span>Solicitações pendentes</span></a>' +
      '<a class="kp' + (venc ? ' cr' : '') + '" href="#/inicio"><b class="num">' + venc + '</b><span>Tarefas vencidas</span></a></div>';
  }
  let cg = '';
  if (typeof cgAberta === 'function' && alVe()) { const c = cgAberta(); if (c && (c.contadorId === u.id || (alSup() && (c.recontar && Object.keys(c.recontar).some(k => c.recontar[k]) || cgProgresso(c).faltam.length === 0)))) { const pr = cgProgresso(c), pct = pr.total ? Math.round(pr.feitos / pr.total * 100) : 0, minha = c.contadorId === u.id;
    cg = '<a class="pn ini-cg" href="#/almox/contagem"><span class="ico ini-wa">' + ic('lista') + '</span><span class="tx"><b>' + (minha ? (pr.recontar.length ? 'Recontar ' + pr.recontar.length + ' material(is) · ' : 'Contagem para você · ') : 'Contagem para conferir · ') + esc(c.numero) + '</b><small>' + pr.feitos + ' de ' + pr.total + ' contados · ' + pct + '%</small></span><span class="ini-cgb"><i style="width:' + pct + '%"></i></span>' + ic('seta') + '</a>'; } }
  return h + cg + nums + '<div class="ini-gr"><div class="ini-col">' + tarefas + plano + '</div><div class="ini-col">' + atalhos + '</div></div>';
};

/* ===== areas.js ===== */
/* EFCwork · areas.js — telas das áreas que ainda não foram refeitas. Mostram o que a área vai ter e levam ao EFClaudian. Prefixo: ar.
   Cada área nova (v0.2 em diante) entra com o seu próprio módulo e registra TELAS[área]; esta tela some sozinha. */
const AR_PLANO = {
  coletas: ['Amostras numa tabela só, com o tipo no filtro (Solo, Nematoide, Folha, Fruta, Composto, Água)', 'Ciclo da amostra na gaveta: Programação, Coleta, Envio, OS, Laudo arquivado e Compra do serviço', 'NF do pacote, cupom dos Correios e código de rastreio no envio', 'Prazo do laboratório com aviso de atraso; laudo fora da faixa vira não conformidade'],
  rateios: ['Uma tela só, com o tipo (Campo, Água, Calibração) no filtro', 'Emitir a solicitação de compra direto do rateio', 'Painel do rateio em Relatórios'],
  inspecoes: ['Cloro', 'Apontamentos, com o relatório como botão', 'Auditoria interna (RNC)'],
  documentos: ['Documentos com o resumo no topo', 'Caixas d’água', 'Histórico (lançamentos e correções, com filtro)'],
  qualidade: ['Não conformidades', 'Análise de problemas', 'Bugs e sugestões'],
  relatorios: ['Documentos (gráficos)', 'Rateio', 'Almoxarifado do mês', 'Apontamentos', 'Coletas em aberto', 'Semana']
};
function arEmBreve(ar) {
  const aba = ar.abas.find(x => x.id === S.rota.aba);
  return cabecalho({ titulo: aba ? aba.nome : ar.nome, abaNome: aba && ar.abas.length > 1 ? aba.nome : '', meta: [metaPl('chega na ' + (ar.versao || 'próxima versão'), 'wa', 'relogio')], acoes: '<a class="bt pr" href="' + EFCLAUDIAN_URL + '" target="_blank" rel="noopener">' + ic('externo') + 'Usar no EFClaudian</a>' }) +
    '<section class="pn"><div class="vazio ar-vz">' + ic(ar.ic) + '<b>Esta área está sendo refeita no ' + APP_NOME + '.</b><span>Enquanto isso, ela continua funcionando no EFClaudian, com os mesmos dados.</span></div>' +
    (AR_PLANO[ar.id] ? '<div class="cpo ar-pl"><p class="ini-sub">O que vem aqui</p><ul>' + AR_PLANO[ar.id].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '') + '</section>';
}

/* ===== adm.js ===== */
/* EFCwork · adm.js — Administração: Empresa (nome, unidades, logo — nada fixo no código), Aparência (tema) e Sobre. Prefixo: adm.
   A empresa fica em sv2_cfg/empresa (mesmo Firebase do EFClaudian). Só o Principal altera; os outros veem. */
function admEmpresa() {
  const e = S.empresa || {}, pode = isPrincipal(S.user), un = e.unidades || [], logo = imgSrc(e.logo);
  const minha = Store.get('cw-unidade') || un[0] || '';
  return '<div class="adm-gr"><section class="pn"><div class="hd"><h3>Dados da empresa</h3><span class="sp"></span>' + (pode ? '' : '<span class="pill">só o Administrador altera</span>') + '</div>' +
    '<form class="cpo" data-form="adm-empresa">' +
    '<div class="adm-logo"><span class="adm-lg">' + (logo ? '<img src="' + logo + '" alt="Logo atual">' : ic('imagem')) + '</span><div><b>Logo</b><small>PNG ou JPG; o app reduz para 256 px.</small>' +
    (pode ? '<div class="adm-lgb"><label class="bt">' + ic('imagem') + 'Escolher<input type="file" id="adm-logo" accept="image/png,image/jpeg,image/webp" hidden></label>' + (logo ? '<button type="button" class="bt ic-so" data-act="adm-tira-logo" title="Tirar a logo" aria-label="Tirar a logo">' + ic('lixo') + '</button>' : '') + '</div>' : '') + '</div></div>' +
    '<label class="cp">Nome da empresa<input id="adm-nome" maxlength="80" value="' + esc(e.nome || '') + '"' + (pode ? '' : ' disabled') + ' placeholder="Ex.: Fazenda Boa Vista"></label>' +
    '<label class="cp">Unidades<textarea id="adm-un" rows="4"' + (pode ? '' : ' disabled') + ' placeholder="Uma por linha. Ex.: Unidade Sede">' + esc(un.join('\n')) + '</textarea><small>Uma por linha. Aparecem no menu e nos filtros.</small></label>' +
    (pode ? '<p class="en-msg" id="adm-msg" role="alert"></p><div><button class="bt pr" type="submit">Salvar</button></div>' : '') + '</form></section>' +
    '<section class="pn"><div class="hd"><h3>Unidade deste aparelho</h3></div><div class="cpo">' +
    (un.length ? '<p class="ini-vz">Usada como padrão nos filtros, neste aparelho.</p>' + ddHTML('adm:unid', minha, un.map(x => [x, x])) : '<p class="ini-vz">Cadastre as unidades ao lado.</p>') +
    '</div></section></div>';
}
function admAparencia() {
  return '<section class="pn adm-uma"><div class="hd"><h3>Tema</h3></div><div class="cpo"><p class="ini-vz">Vale só neste aparelho.</p>' + ddHTML('adm:tema', csTema(), [['claro', 'Claro'], ['escuro', 'Escuro (Dourado)']]) + '</div></section>';
}
function admSobre() {
  const l = [['App', APP_NOME + ' · ' + APP_APELIDO], ['Família', APP_FAMILIA], ['Versão', 'v' + VERSAO], ['Dados', DEMO ? 'Demonstração (só neste navegador)' : 'Firebase do EFClaudian (mesmas coleções)'], ['Empresa', (S.empresa && S.empresa.nome) || 'não configurada']];
  return '<section class="pn adm-uma"><div class="hd"><h3>Sobre</h3></div><dl class="adm-dl">' + l.map(x => '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>').join('') + '</dl></section>';
}
TELAS.adm = function (aba) {
  const t = { empresa: 'Empresa', aparencia: 'Aparência', sobre: 'Sobre' }[aba] || 'Empresa';
  return cabecalho({ titulo: t, abaNome: t, meta: aba === 'empresa' ? [metaPl(isPrincipal(S.user) ? 'você pode alterar' : 'somente leitura', isPrincipal(S.user) ? 'ok' : '', 'info')] : [] }) +
    (aba === 'aparencia' ? admAparencia() : aba === 'sobre' ? admSobre() : admEmpresa());
};

/* logo: reduz no aparelho antes de guardar (máx. 256 px) */
function admReduz(arq) {
  return new Promise((res, rej) => {
    if (!arq || !/^image\//.test(arq.type)) return rej(new Error('tipo'));
    const r = new FileReader(); r.onerror = () => rej(new Error('ler'));
    r.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('img')); im.onload = () => {
      const k = Math.min(1, 256 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; im.src = r.result; };
    r.readAsDataURL(arq);
  });
}
async function admGrava(patch, msgOk) {
  const e = Object.assign({ nome: '', unidades: [], logo: '' }, S.empresa || {}, patch);
  delete e.id; delete e.srv; e.atualizadoEm = nowISO(); e.atualizadoPor = S.user.id;
  try { await Data.col('sv2_cfg').set('empresa', e); S.empresa = Object.assign({ id: 'empresa' }, e); aviso(msgOk || 'Empresa salva.'); render(); }
  catch (er) { console.error(er); const m = $('#adm-msg'); const t = /permission/i.test(er && (er.code || er.message) || '') ? 'O Firebase não deixou salvar (permissão). As regras precisam liberar sv2_cfg/empresa para o Administrador.' : 'Não foi possível salvar agora.'; if (m) m.textContent = t; else aviso(t, 'erro'); }
}
document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('[data-form="adm-empresa"]'); if (!f) return;
  e.preventDefault(); if (!isPrincipal(S.user)) return;
  const nome = $('#adm-nome').value.trim(), un = $('#adm-un').value.split('\n').map(x => x.trim()).filter(Boolean).filter((x, i, l) => l.indexOf(x) === i).slice(0, 20);
  if (nome.length < 2) { $('#adm-msg').textContent = 'Informe o nome da empresa.'; return; }
  admGrava({ nome: nome, unidades: un });
});
document.addEventListener('change', async e => {
  if (e.target && e.target.id === 'adm-logo') {
    try { const d = await admReduz(e.target.files[0]); await admGrava({ logo: d }, 'Logo salva.'); } catch (er) { aviso('Não deu para usar esse arquivo como logo.', 'erro'); }
  }
});
DD_AO.adm = (k, v) => { if (k === 'tema') csTrocaTema(v); else if (k === 'unid') { Store.set('cw-unidade', v); aviso('Unidade deste aparelho: ' + v); render(); } };
document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-act="adm-tira-logo"]'); if (t) admGrava({ logo: '' }, 'Logo retirada.'); });

/* liga tudo (último módulo da montagem) */
csIniciar();

</script>
